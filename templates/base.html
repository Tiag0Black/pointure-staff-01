<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STAFF MANAGEMENT{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">STAFF <span>MANAGEMENT</span></a>
  <nav>
    <a href="{{ url_for('index') }}">Pointage</a>
    <a href="{{ url_for('admin_dashboard') }}">Tableau général</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>STAFF MANAGEMENT · Gestion des temps de service</footer>
</body>
</html>
